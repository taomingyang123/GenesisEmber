        function buyPerk(perkId) {
            const pDef = PERKS_DEF.find(p => p.id === perkId);
            if (!pDef) return;
            const lv = getPerkLevel(perkId);
            if (lv >= 5) return;
            const cost = pDef.costs[lv];
            if ((save.prestige.genesisShards || 0) < cost) return;

            save.prestige.genesisShards -= cost;
            save.prestige.perks[perkId] = lv + 1;
            sound.playTech();
            showToast(`✨ 永久天赋升级：【${pDef.name}】Lv.${lv + 1}`);
            saveGame(false);
            dirtyUI = true;
            updateUI();
        }

        /* =====================================================================
           9. 离屏 64×64 像素动画引擎（严格节流 15 FPS + 后台自动休眠）
           ===================================================================== */
        const offCanvas = document.createElement('canvas');
        offCanvas.width = 64;
        offCanvas.height = 64;
        const offCtx = offCanvas.getContext('2d');
        offCtx.imageSmoothingEnabled = false;

        const mainCanvas = document.getElementById('pixel-canvas');
        const mainCtx = mainCanvas.getContext('2d');
        mainCtx.imageSmoothingEnabled = false;

        let animTick = 0;

        function pxRect(x, y, w, h, color) {
            offCtx.fillStyle = color;
            offCtx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
        }

        function renderPixelScene() {
            animTick++;
            const w = save.world;
            const era = ERAS_DEF[w.eraIndex] || ERAS_DEF[0];

            // 天空/背景渐变色块
            pxRect(0, 0, 64, 42, era.bgTop);
            pxRect(0, 42, 64, 22, era.bgBot);

            const t = animTick * 0.25;

            if (w.eraIndex === 0) {
                // 时代 1：生命起源 - 旋转 DNA 双螺旋 + 细胞器/线粒体漂浮微粒
                const orgCount = Math.min(8, 4 + ((w.evoCells && w.evoCells.organelles) || 0));
                for (let i = 0; i < orgCount; i++) {
                    const bx = (i * 11 + Math.floor(t * 2)) % 60 + 2;
                    const by = 56 - ((i * 9 + Math.floor(t * 3)) % 50);
                    pxRect(bx, by, 2, 2, i % 2 === 0 ? 'rgba(56, 189, 248, 0.45)' : 'rgba(168, 85, 247, 0.45)');
                }
                for (let y = 10; y < 54; y += 3) {
                    const phase = y * 0.22 + t;
                    const x1 = 32 + Math.sin(phase) * 12;
                    const x2 = 32 - Math.sin(phase) * 12;
                    if (y % 6 === 0) {
                        const minX = Math.min(x1, x2);
                        const len = Math.abs(x1 - x2);
                        pxRect(minX, y, len, 1, '#38bdf8');
                    }
                    pxRect(x1 - 1, y - 1, 3, 3, '#10b981');
                    pxRect(x2 - 1, y - 1, 3, 3, '#f59e0b');
                }
            } else if (w.eraIndex === 1) {
                // 时代 2：农业文明 - 茅草屋、摇曳麦田、飘动白云与小人
                const cloudX = (Math.floor(t * 1.5)) % 76 - 12;
                pxRect(cloudX, 8, 12, 4, '#cbd5e1');
                pxRect(cloudX + 2, 6, 8, 2, '#f8fafc');

                pxRect(0, 38, 64, 26, '#15803d');
                pxRect(0, 48, 64, 16, '#14532d');
                const sway = Math.round(Math.sin(t));
                for (let gx = 4; gx < 34; gx += 4) {
                    pxRect(gx + sway, 40, 2, 7, '#eab308');
                }
                pxRect(38, 28, 18, 12, '#92400e');
                pxRect(35, 24, 24, 4, '#d97706');
                pxRect(39, 21, 16, 3, '#f59e0b');
                pxRect(45, 33, 4, 7, '#451a03');
                const walk = Math.round(Math.sin(t * 1.5) * 3);
                pxRect(26 + walk, 32, 3, 3, '#fde68a');
                pxRect(26 + walk, 35, 3, 4, '#38bdf8');
            } else if (w.eraIndex === 2) {
                // 时代 3：城市文明 - 石砌城墙、冶炼炉火光与市场旗帜
                pxRect(0, 42, 64, 22, '#334155');
                pxRect(6, 20, 14, 22, '#64748b');
                pxRect(6, 17, 3, 3, '#94a3b8');
                pxRect(12, 17, 3, 3, '#94a3b8');
                pxRect(17, 17, 3, 3, '#94a3b8');
                pxRect(26, 24, 20, 18, '#7c2d12');
                pxRect(24, 21, 24, 3, '#b45309');
                const flame = (animTick % 4 < 2) ? '#f97316' : '#facc15';
                pxRect(33, 33, 6, 9, flame);
                pxRect(49, 30, 12, 12, '#4338ca');
                pxRect(48, 28, 14, 3, '#ec4899');
            } else if (w.eraIndex === 3) {
                // 时代 4：工业文明 - 钢铁厂房、高耸烟囱与沃登克里弗电塔
                pxRect(0, 44, 64, 20, '#1e293b');
                pxRect(10, 24, 34, 20, '#475569');
                pxRect(14, 12, 5, 12, '#334155');
                pxRect(28, 10, 5, 14, '#334155');
                for (let wx = 14; wx <= 36; wx += 6) {
                    pxRect(wx, 30, 3, 4, '#fbbf24');
                }
                for (let s = 0; s < 3; s++) {
                    const sy = 8 - ((animTick + s * 3) % 8);
                    const sx = 15 + ((animTick + s * 2) % 6);
                    pxRect(sx, sy, 4, 3, '#94a3b8');
                    pxRect(sx + 14, sy - 2, 4, 3, '#cbd5e1');
                }
                pxRect(52, 18, 2, 26, '#94a3b8');
                pxRect(48, 22, 10, 2, '#38bdf8');
            } else if (w.eraIndex === 4) {
                // 时代 5：原子时代 - 双曲冷却塔、切伦科夫反应堆与战略导弹发射井
                pxRect(0, 45, 64, 19, '#0f291e');
                pxRect(8, 20, 14, 25, '#cbd5e1');
                pxRect(10, 16, 10, 4, '#e2e8f0');
                pxRect(26, 26, 20, 19, '#334155');
                pxRect(29, 21, 14, 5, '#475569');
                const glow = (animTick % 6 < 3) ? '#10b981' : '#6ee7b7';
                pxRect(32, 31, 8, 8, glow);
                // 核弹发射井
                if (w.extraBlds && (w.extraBlds.missile_silo || 0) > 0) {
                    pxRect(50, 22, 8, 23, '#475569');
                    pxRect(52, 16, 4, 6, '#f43f5e');
                }
            } else if (w.eraIndex === 5) {
                // 时代 6：信息文明 - 量子服务器阵列与神经网络光束
                pxRect(0, 46, 64, 18, '#09111e');
                for (let rx = 8; rx <= 44; rx += 18) {
                    pxRect(rx, 16, 12, 30, '#1e293b');
                    for (let ly = 19; ly <= 40; ly += 5) {
                        const led = ((animTick + rx + ly) % 5 === 0) ? '#38bdf8' : '#10b981';
                        pxRect(rx + 2, ly, 3, 2, led);
                        pxRect(rx + 7, ly, 3, 2, '#6366f1');
                    }
                }
                const dx = (animTick * 4) % 56 + 4;
                pxRect(dx, 9, 6, 2, '#38bdf8');
            } else {
                // 时代 7：太空文明 - 星空、火星星球、航天发射台与殖民方舟火箭
                for (let i = 0; i < 14; i++) {
                    const sx = (i * 17 + 5) % 62;
                    const sy = (i * 13 + 3) % 38;
                    pxRect(sx, sy, 1, 1, (animTick + i) % 4 === 0 ? '#f8fafc' : '#64748b');
                }
                pxRect(46, 8, 10, 10, '#ea580c');
                pxRect(48, 10, 4, 3, '#fb923c');
                pxRect(0, 46, 64, 18, '#1e1b4b');
                pxRect(18, 22, 3, 24, '#64748b');
                const hover = Math.round(Math.sin(t) * 1);
                pxRect(26, 16 + hover, 8, 22, '#f8fafc');
                pxRect(28, 12 + hover, 4, 4, '#ef4444');
                pxRect(24, 32 + hover, 2, 6, '#38bdf8');
                pxRect(34, 32 + hover, 2, 6, '#38bdf8');
                const thr = (animTick % 2 === 0) ? '#f59e0b' : '#ef4444';
                pxRect(28, 38 + hover, 4, 5, thr);
            }

            // 气象雨雪与月相像素叠加特效
            if (window.EvolveModules && window.EvolveModules.Bridge) {
                window.EvolveModules.Bridge.renderSceneOverlay(offCtx, animTick, pxRect, w);
            }

            // 更新并绘制粒子池
            for (let i = 0; i < PARTICLE_MAX; i++) {
                const p = particlePool[i];
                if (!p.active) continue;
                p.x += p.vx * 0.066;
                p.y += p.vy * 0.066;
                p.vy += 24 * 0.066;
                p.life -= 0.066;
                if (p.life <= 0) {
                    p.active = false;
                } else {
                    pxRect(p.x, p.y, 2, 2, p.color);
                }
            }

            mainCtx.clearRect(0, 0, 64, 64);
            mainCtx.drawImage(offCanvas, 0, 0);
        }

        /* =====================================================================
           10. 差量 DOM 渲染（列表结构仅在脏标记时重建，250ms Tick 只做文本与状态更新）
           ===================================================================== */
        let dirtyUI = true;

        function buildLeftResourceCards() {
            const grid = document.getElementById('left-res-grid');
            if (!grid) return;
            grid.innerHTML = '';
            RESOURCES_DEF.forEach(r => {
                const card = document.createElement('div');
                card.id = `lres-card-${r.id}`;
                card.className = 'res-mini-card hidden';
                card.dataset.resId = r.id;
                card.innerHTML = `
                    <div class="res-mini-left">
                        <span class="res-mini-name">${r.name}</span>
                        <span id="lres-cap-${r.id}" class="res-mini-cap">0/${r.baseCap}</span>
                    </div>
                    <div class="res-mini-right">
                        <span id="lres-rate-${r.id}" class="res-mini-rate text-muted">0.0/s</span>
                        <span id="lres-eta-${r.id}" class="res-mini-eta">平衡</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateLeftResourceCards() {
            const w = save.world;
            let unlockedCount = 0;
            const totalResCount = w.eraIndex >= 1 ? RESOURCES_DEF.length - 2 : RESOURCES_DEF.length;
            for (const r of RESOURCES_DEF) {
                const isRetiredBio = w.eraIndex >= 1 && (r.id === 'rna' || r.id === 'dna');
                const isUnlocked = !isRetiredBio && !!w.unlockedRes[r.id];
                const card = document.getElementById(`lres-card-${r.id}`);
                if (!card) continue;
                if (!isUnlocked) {
                    card.classList.add('hidden');
                    continue;
                }
                unlockedCount++;
                card.classList.remove('hidden');

                const val = w.res[r.id] || 0;
                const cap = metrics.caps[r.id] || r.baseCap;
                const net = metrics.netRates[r.id] || 0;

                const capEl = document.getElementById(`lres-cap-${r.id}`);
                const rateEl = document.getElementById(`lres-rate-${r.id}`);
                const etaEl = document.getElementById(`lres-eta-${r.id}`);

                if (capEl) capEl.textContent = `${fmt(val)}/${fmt(cap)}`;
                if (rateEl) {
                    rateEl.textContent = fmtRate(net);
                    rateEl.className = `res-mini-rate ${net > 0.05 ? 'text-emerald' : (net < -0.05 ? 'text-rose' : 'text-muted')}`;
                }
                if (etaEl) {
                    if (net > 0.05 && val < cap) {
                        const sec = Math.ceil((cap - val) / net);
                        etaEl.textContent = sec > 9999 ? '满:>9999s' : `满:${sec}s`;
                    } else if (net < -0.05 && val > 0) {
                        const sec = Math.ceil(val / Math.abs(net));
                        etaEl.textContent = `空:${sec}s`;
                    } else {
                        etaEl.textContent = '平衡';
                    }
                }
            }
            const cntEl = document.getElementById('left-res-count');
            if (cntEl) cntEl.textContent = `已解锁 ${unlockedCount}/${totalResCount}`;
        }

        function formatCostInline(costObj) {
            return Object.entries(costObj)
                .map(([rId, amt]) => {
                    const name = RES_MAP[rId] ? RES_MAP[rId].name : rId;
                    const have = save.world.res[rId] || 0;
                    const cls = have >= amt ? 'text-emerald' : 'text-rose';
                    return `<span class="${cls}">${name}:${fmt(amt)}</span>`;
                })
                .join(' ');
        }

                    actBtn.disabled = false;
                }
                actSub.textContent = `RNA:${fmt(w.res.rna)}/${metrics.caps.rna} | DNA:${fmt(w.res.dna)}/${metrics.caps.dna}`;
            } else if (w.eraIndex === 1) {
                actTitle.textContent = era.actionBtn.title;
                actBtn.disabled = false;
                actSub.textContent = `木:${fmt(w.res.lumber)} 石:${fmt(w.res.stone)} 知:${fmt(w.res.knowledge)}`;
            } else {
                actTitle.textContent = era.actionBtn.title;
                actBtn.disabled = false;
                actSub.textContent = `币:${fmt(w.res.money)} 知:${fmt(w.res.knowledge)}`;
            }

            const nextBtn = document.getElementById('btn-next-era');
            const nextTitle = document.getElementById('btn-next-era-title');
            const nextSub = document.getElementById('btn-next-era-sub');
            if (canMadResetNow() && w.eraIndex < 6) {
                nextTitle.textContent = `☢️ 核弹重置就绪 (+${calcMadPlasmidGain()}余烬)`;
                nextSub.textContent = '点击前往【核爆/跃迁】发射核弹或继续冲刺太空';
                nextBtn.className = 'pixel-btn action-main-btn bg-rose';
                nextBtn.disabled = false;
            } else if (w.eraIndex < ERAS_DEF.length - 1) {
                nextTitle.textContent = `下一时代: ${ERAS_DEF[w.eraIndex + 1].name}`;
                nextSub.textContent = era.nextReqText;
                nextBtn.className = 'pixel-btn action-main-btn bg-slate';
                nextBtn.disabled = true;
            } else {
                const canP = canPrestigeNow();
                nextTitle.textContent = canP ? '🚀 启动恒星际跃迁' : '终局时代: 太空文明';
                nextSub.textContent = canP ? `可获得 +${calcPrestigeGain()} 创世余烬` : era.nextReqText;
                nextBtn.className = `pixel-btn action-main-btn ${canP ? 'bg-purple' : 'bg-slate'}`;
                nextBtn.disabled = !canP;
            }

            // 更新左侧全文明资源监控卡片
            updateLeftResourceCards();

            // 更新 Tab 小圆点徽章
            const canEvo = EVO_CHAIN_IDS.some(id => {
                const t = TECH_MAP[id];
                return !w.techs[id] && t.req.every(r => !!w.techs[r]) && canAffordCost(getEffectiveTechCost(t));
            }) || (w.eraIndex === 0 && EVOLVE_CELL_STRUCTURES_DEF.some(c => (!c.reqEvo || w.techs[c.reqEvo]) && canAffordCost(getCellStructureCost(c))));
            const assigned = Object.values(w.jobs).reduce((a, c) => a + c, 0);
            const hasIdle = w.eraIndex >= 1 && (Math.floor(w.pop) - assigned) > 0;
            document.getElementById('badge-evo').classList.toggle('show', canEvo || hasIdle);

            const canTech = TECHS_DEF.some(t => t.era >= 1 && !w.techs[t.id] && t.era <= w.eraIndex && t.req.every(r => !!w.techs[r]) && canAffordCost(getEffectiveTechCost(t)));
            document.getElementById('badge-tech').classList.toggle('show', canTech);

            const allExtraDefs = [...EVOLVE_EXTRA_BLDS_DEF, ...((dl && dl.DATA.extraBuildings) || [])];
            const canBld = BUILDINGS_DEF.some(b => (!b.reqTech || w.techs[b.reqTech]) && (!b.maxCount || (w.buildings[b.id] || 0) < b.maxCount) && canAffordCost(getBuildingCost(b, 1)))
                || allExtraDefs.some(b => (!b.reqTech || w.techs[b.reqTech]) && (!b.maxCount || (w.extraBlds[b.id] || 0) < b.maxCount) && canAffordCost(getBuildingCost(b, 1, true)));
            document.getElementById('badge-bld').classList.toggle('show', canBld);

            document.getElementById('badge-prestige').classList.toggle('show', canPrestigeNow() || canMadResetNow());

            // 局部增量刷新当前激活 Tab 内的动态文本，避免整页重建破坏点击
            const effBatch = getEffectiveBatch();
            if (dirtyUI) {
                dirtyUI = false;
                renderTabContent();
            } else {
                if (activeTab === 'evo') {
                if (w.eraIndex === 0) {
                    document.querySelectorAll('#tab-content button[data-cell]').forEach(btn => {
                        const cDef = EVOLVE_CELL_STRUCTURES_DEF.find(c => c.id === btn.dataset.cell);
                        if (!cDef) return;
                        const ok = canAffordCost(getCellStructureCost(cDef));
                        btn.disabled = !ok;
                        btn.className = `pixel-btn ${ok ? 'bg-amber' : 'bg-slate'} text-11 font-bold shrink-0`;
                    });
                } else {
                    const idleEl = document.getElementById('job-idle-cnt');
                    const totEl = document.getElementById('job-total-cnt');
                    const rateEl = document.getElementById('pop-growth-rate');
                    const detEl = document.getElementById('pop-growth-detail');
                    const recBtn = document.getElementById('btn-recruit-pop');

                    if (idleEl) idleEl.textContent = Math.max(0, Math.floor(w.pop) - assigned);
                    if (totEl) totEl.textContent = Math.floor(w.pop);
                    if (rateEl) rateEl.textContent = `+${metrics.popGrowthRate.toFixed(2)} 人/秒`;
                    if (detEl) detEl.textContent = `基础 +${metrics.popBaseRate.toFixed(2)}/s | 空房引力 +${metrics.popVacancyBonus.toFixed(2)}/s | 繁荣倍率 ×${metrics.popProsperityMult.toFixed(1)}`;
                    if (recBtn) {
                        const vacant = Math.max(0, metrics.popCap - Math.floor(w.pop));
                        const rCost = getRecruitFoodCost();
                        const rGain = Math.min(2, vacant);
                        const ok = rGain > 0 && (w.res.food || 0) >= rCost;
                        recBtn.disabled = !ok;
                        recBtn.className = `pixel-btn ${ok ? 'bg-emerald' : 'bg-slate'} text-11 font-bold shrink-0`;
                        recBtn.textContent = vacant <= 0 ? '住房已满' : `📣 吸引流民 (+${rGain}人 / ${fmt(rCost)}食物)`;
                    }
                }
                document.querySelectorAll('#tab-content button[data-research]').forEach(btn => {
                    const tDef = TECH_MAP[btn.dataset.research];
                    if (!tDef || w.techs[tDef.id]) return;
                    const reqOk = tDef.req.every(r => !!w.techs[r]);
                    const ok = reqOk && canAffordCost(getEffectiveTechCost(tDef));
                    btn.disabled = !ok;
                    btn.className = `pixel-btn ${ok ? 'bg-emerald' : 'bg-slate'} text-11 font-bold shrink-0`;
                });
            } else if (activeTab === 'bld' || activeTab === 'tech') {
                document.querySelectorAll('#tab-content button[data-build]').forEach(btn => {
                    const bDef = BUILDINGS_DEF.find(b => b.id === btn.dataset.build);
                    if (!bDef) return;
                    const owned = w.buildings[bDef.id] || 0;
                    const maxed = bDef.maxCount && owned >= bDef.maxCount;
                    if (maxed) return;
                    const qty = effBatch === 'MAX' ? Math.max(1, getMaxAffordableBuilding(bDef)) : effBatch;
                    const ok = effBatch === 'MAX' ? getMaxAffordableBuilding(bDef) >= 1 : canAffordCost(getBuildingCost(bDef, qty));
                    btn.disabled = !ok;
                    btn.className = `pixel-btn ${ok ? 'bg-amber' : 'bg-slate'} text-11 font-bold`;
                });
                document.querySelectorAll('#tab-content button[data-extra-build]').forEach(btn => {
                    const bDef = getExtraBuildingDef(btn.dataset.extraBuild);
                    if (!bDef) return;
                    const qty = effBatch === 'MAX' ? Math.max(1, getMaxAffordableBuilding(bDef, true)) : effBatch;
                    const ok = effBatch === 'MAX' ? getMaxAffordableBuilding(bDef, true) >= 1 : canAffordCost(getBuildingCost(bDef, qty, true));
                    btn.disabled = !ok;
                    btn.className = `pixel-btn ${ok ? 'bg-purple' : 'bg-slate'} text-11 font-bold`;
                });
                document.querySelectorAll('#tab-content button[data-research]').forEach(btn => {
                    const tDef = TECH_MAP[btn.dataset.research];
                    if (!tDef || w.techs[tDef.id]) return;
                    const reqOk = tDef.req.every(r => !!w.techs[r]);
                    const ok = reqOk && canAffordCost(getEffectiveTechCost(tDef));
                    btn.disabled = !ok;
                    btn.className = `pixel-btn ${ok ? 'bg-sky' : 'bg-slate'} text-11 font-bold`;
                });
                }
                if (window.EvolveModules && window.EvolveModules.UI && window.EvolveModules.UI.refreshLiveWidgets) {
                    window.EvolveModules.UI.refreshLiveWidgets(getHostApi());
                }
            }
        }

        /* =====================================================================
           11. 存档、离线收益追赶与导入/导出
           ===================================================================== */
        function applySettings() {
            document.body.classList.toggle('crt-enabled', !!save.settings.crt);
            if (window.EvolveModules && window.EvolveModules.DataLoader) {
                window.EvolveModules.DataLoader.applyTheme(save.settings.theme || 'pixel');
            }
        }

        function saveGame(notify = true) {
            try {
                save.lastActiveAt = Date.now();
                localStorage.setItem(SAVE_KEY, JSON.stringify(save));
                if (notify) showToast('💾 游戏进度已保存！');
            } catch (_) {}
        }

        function loadGame() {
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object') return;
                save = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SAVE)), parsed);
                save.world = Object.assign(createInitialWorld(), parsed.world || {});
                save.prestige = Object.assign({ count: 0, madCount: 0, arkCount: 0, genesisShards: 0, lifetimeShards: 0, phage: 0, rapidMutation: false, ancientRuins: false, perks: {} }, parsed.prestige || {});
                save.settings = Object.assign({ sound: true, crt: false }, parsed.settings || {});
                ensureEvolveWorldFields();

                recomputeCapacities();
                checkMissions();
                checkEraAdvancement();

                // 计算离线收益（受深度休眠天赋 8~48 小时上限约束）
                const maxHours = [8, 12, 18, 24, 36, 48][getPerkLevel('deepHibernation')] || 8;
                const elapsedSec = Math.min(maxHours * 3600, Math.max(0, (Date.now() - (save.lastActiveAt || Date.now())) / 1000));
                if (elapsedSec >= 10) {
                    const steps = Math.min(360, Math.floor(elapsedSec / 2));
                    const stepDt = elapsedSec / steps;
                    for (let i = 0; i < steps; i++) {
                        stepSimulation(stepDt);
                    }
                    checkMissions();
                    checkEraAdvancement();
                    showToast(`💤 欢迎回来！已结算 ${Math.floor(elapsedSec / 60)} 分钟离线收益`);
                }
            } catch (_) {}
        }

        function exportSaveCode() {
            saveGame(false);
            const code = btoa(unescape(encodeURIComponent(JSON.stringify(save))));
            openModal({
                title: '📤 导出跨设备存档码',
                bodyHtml: '请复制下方 Base64 存档码，在另一台设备点击【导入存档码】即可无缝同步进度：',
                showTextarea: true,
                textareaValue: code,
                readonly: true,
                buttons: [
                    { text: '关闭', cls: 'bg-slate' },
                    {
                        text: '📋 复制存档码',
                        cls: 'bg-sky',
                        close: false,
                        onClick: () => {
                            const ta = document.getElementById('modal-textarea');
                            ta.select();
                            try {
                                document.execCommand('copy');
                                showToast('📋 存档码已复制到剪贴板！');
                            } catch (_) {
                                showToast('请手动长按全选复制！');
                            }
                        }
                    }
                ]
            });
        }

        function importSaveCode() {
            openModal({
                title: '📥 导入存档码',
                bodyHtml: '请在下方粘贴之前导出的 Base64 存档码：',
                showTextarea: true,
                textareaValue: '',
                readonly: false,
                buttons: [
                    { text: '取消', cls: 'bg-slate' },
                    {
                        text: '✅ 确认导入',
                        cls: 'bg-emerald',
                        onClick: (val) => {
                            try {
                                const trimmed = (val || '').trim();
                                if (!trimmed) return;
                                const jsonStr = decodeURIComponent(escape(atob(trimmed)));
                                const parsed = JSON.parse(jsonStr);
                                if (!parsed || !parsed.world) throw new Error('Invalid');
                                localStorage.setItem(SAVE_KEY, JSON.stringify(parsed));
                                loadGame();
                                applySettings();
                                dirtyUI = true;
                                updateUI();
                                showToast('🎉 存档导入成功！');
                            } catch (_) {
                                showToast('❌ 存档码格式无效，导入失败！');
                            }
                        }
                    }
                ]
            });
        }

        function hardResetGame() {
            openModal({
                title: '⚠️ 确认清空全部存档？',
                bodyHtml: '此操作将彻底清除当前进度与创世余烬并从头开始，无法撤销！',
                buttons: [
                    { text: '取消', cls: 'bg-slate' },
                    {
                        text: '🗑️ 确认清空',
                        cls: 'bg-rose',
                        onClick: () => {
                            localStorage.removeItem(SAVE_KEY);
                            save = JSON.parse(JSON.stringify(DEFAULT_SAVE));
                            applySettings();
                            recomputeCapacities();
                            dirtyUI = true;
                            updateUI();
                            showToast('🗑️ 存档已重置为全新宇宙！');
                        }
                    }
                ]
            });
        }

        /* =====================================================================
           12. 事件绑定与主循环启动
           ===================================================================== */
        function switchTab(nextTab, subTabId) {
            if (subTabId && window.EvolveModules && window.EvolveModules.UI) {
                window.EvolveModules.UI.setSubTab(nextTab, subTabId);
            }
            if (activeTab === nextTab && !subTabId) return;
            activeTab = nextTab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
            dirtyUI = true;
            updateUI();
        }

        function bindEvents() {
            // 1. 像素舞台单次点击采集
            const canvasWrap = document.getElementById('canvas-wrapper');
            canvasWrap.addEventListener('pointerdown', e => {
                e.preventDefault();
                handleStageManualClick(e.clientX, e.clientY);
            });

            document.getElementById('btn-stage-hint').addEventListener('pointerdown', e => {
                e.preventDefault();
                handleStageManualClick();
            });

            // 顶部快捷导航
            document.getElementById('hdr-mission-banner').addEventListener('click', () => switchTab('prestige', 'pres_perks'));
            document.getElementById('kpi-pill-prestige').addEventListener('click', () => switchTab('prestige', 'pres_crispr'));
            document.getElementById('kpi-pop-box').addEventListener('click', () => switchTab('evo', 'evo_pop'));
            document.getElementById('kpi-pill-1').addEventListener('click', () => switchTab('sys', 'sys_wiki'));
            document.getElementById('kpi-pill-2').addEventListener('click', () => switchTab('sys', 'sys_wiki'));
            const weatherStrip = document.getElementById('hdr-weather-strip');
            if (weatherStrip) {
                weatherStrip.style.cursor = 'pointer';
                weatherStrip.addEventListener('click', () => switchTab('sys', 'sys_ach'));
            }
            const leftResGrid = document.getElementById('left-res-grid');
            if (leftResGrid) {
                leftResGrid.style.cursor = 'pointer';
                leftResGrid.addEventListener('click', () => {
                    if (window.getSelection && window.getSelection().toString()) return;
                    if (save.world.eraIndex >= 1) switchTab('bld', 'bld_storage');
                    else switchTab('sys', 'sys_wiki');
                });
            }

            // 2. 键盘空格采集 + Ctrl(10x) / Shift(25x) / Alt(100x) 修饰键批买联动
            const updateModifierFromEvent = (e) => {
                if (!save.settings || save.settings.mKeys === false) {
                    if (modifierBatch !== 0) {
                        modifierBatch = 0;
                        dirtyUI = true;
                        updateUI();
                    }
                    return;
                }
                const nextMod = e.altKey ? 100 : (e.shiftKey ? 25 : (e.ctrlKey || e.metaKey ? 10 : 0));
                if (nextMod !== modifierBatch) {
                    modifierBatch = nextMod;
                    dirtyUI = true;
                    updateUI();
                }
            };
            window.addEventListener('keydown', e => {
                const tag = document.activeElement ? document.activeElement.tagName : '';
                if (e.code === 'Space' && !e.repeat && tag !== 'TEXTAREA' && tag !== 'INPUT' && tag !== 'SELECT') {
                    e.preventDefault();
                    handleStageManualClick();
                }
                updateModifierFromEvent(e);
            });
            window.addEventListener('keyup', updateModifierFromEvent);
            window.addEventListener('blur', () => {
                if (modifierBatch !== 0) {
                    modifierBatch = 0;
                    dirtyUI = true;
                    updateUI();
                }
            });

            // 3. 左下双操作按钮
            document.getElementById('btn-era-action').addEventListener('click', handleEraActionButton);
            document.getElementById('btn-next-era').addEventListener('click', () => {
                if (save.world.eraIndex === 6 && canPrestigeNow()) {
                    triggerPrestige();
                } else if (canMadResetNow()) {
                    switchTab('prestige', 'pres_reset');
                }
            });

            // 4. 右侧 5 个独立主 Tab 与子页签条切换
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => switchTab(btn.dataset.tab));
            });
            const subTabBar = document.getElementById('subtab-bar');
            if (subTabBar) {
                subTabBar.addEventListener('click', e => {
                    if (window.EvolveModules && window.EvolveModules.UI) {
                        window.EvolveModules.UI.handleSubTabClick(getHostApi(), e.target);
                    }
                });
            }

            // 5. 右侧面板事件委托
            document.getElementById('tab-content').addEventListener('click', e => {
                if (window.EvolveModules && window.EvolveModules.UI && window.EvolveModules.UI.handleSubTabClick(getHostApi(), e.target)) {
                    return;
                }

                if (e.target.closest('#btn-recruit-pop')) {
                    recruitPopulation();
                    return;
                }

                const cellBtn = e.target.closest('button[data-cell]');
                if (cellBtn) {
                    buyCellStructure(cellBtn.dataset.cell);
                    return;
                }

                const kingBtn = e.target.closest('button[data-kingdom]');
                if (kingBtn) {
                    save.world.kingdom = kingBtn.dataset.kingdom;
                    sound.playClick();
                    recomputeCapacities();
                    dirtyUI = true;
                    updateUI();
                    return;
                }

                const specBtn = e.target.closest('button[data-species]');
                if (specBtn) {
                    if (save.world.eraIndex >= 1 || save.world.techs.evo_sapiens) {
                        showToast('🧬 当前轮回物种已完成进化定型，无法再次转化！可在【核爆/跃迁】中预设下一轮物种。');
                        return;
                    }
                    const specId = specBtn.dataset.species;
                    save.world.species = specId;
                    const dl = window.EvolveModules && window.EvolveModules.DataLoader;
                    const sp = dl && dl.MAPS && dl.MAPS.species && dl.MAPS.species[specId];
                    if (sp) {
                        save.world.genus = sp.genus;
                        save.world.kingdom = sp.genus === 'plant' ? 'plant' : (sp.genus === 'fungi' ? 'fungi' : 'animal');
                        showToast(`🧬 已适应演化为：【${sp.name}】`);
                    }
                    sound.playClick();
                    recomputeCapacities();
                    dirtyUI = true;
                    updateUI();
                    return;
                }

                const govBtn = e.target.closest('button[data-gov]');
                if (govBtn) {
                    save.world.gov = govBtn.dataset.gov;
                    sound.playClick();
                    const dl = window.EvolveModules && window.EvolveModules.DataLoader;
                    const govDef = (dl && dl.MAPS && dl.MAPS.governments && dl.MAPS.governments[save.world.gov])
                        || EVOLVE_GOV_DEF.find(g => g.id === save.world.gov);
                    showToast(`🏛️ 政体已切换为：【${govDef ? govDef.name : save.world.gov}】`);
                    recomputeCapacities();
                    dirtyUI = true;
                    updateUI();
                    return;
                }

                const taxBtn = e.target.closest('button[data-tax]');
                if (taxBtn) {
                    save.world.taxRate = Number(taxBtn.dataset.tax);
                    sound.playClick();
                    dirtyUI = true;
                    updateUI();
                    return;
                }

                const smelterBtn = e.target.closest('button[data-smelter]');
                if (smelterBtn) {
                    save.world.smelterMode = smelterBtn.dataset.smelter;
                    sound.playClick();
                    dirtyUI = true;
                    updateUI();
                    return;
                }

                const craftBtn = e.target.closest('button[data-craft]');
                if (craftBtn) {
                    save.world.craftFocus = craftBtn.dataset.craft;
                    sound.playClick();
                    dirtyUI = true;
                    updateUI();
                    return;
                }

                const resBtn = e.target.closest('button[data-research]');
                if (resBtn) {
                    buyTechnology(resBtn.dataset.research);
                    return;
                }

                const bldBtn = e.target.closest('button[data-build]');
                if (bldBtn) {
                    buyBuilding(bldBtn.dataset.build, false);
                    return;
                }

                const exBldBtn = e.target.closest('button[data-extra-build]');
                if (exBldBtn) {
                    buyBuilding(exBldBtn.dataset.extraBuild, true);
                    return;
                }

                const batchBtn = e.target.closest('button[data-batch]');
                if (batchBtn) {
                    const val = batchBtn.dataset.batch;
                    buildBatch = val === 'MAX' ? 'MAX' : Number(val);
                    dirtyUI = true;
                    updateUI();
                    return;
                }

                const jobBtn = e.target.closest('button[data-job]');
                if (jobBtn) {
                    adjustJob(jobBtn.dataset.job, Number(jobBtn.dataset.delta));
                    return;
                }

                const perkBtn = e.target.closest('button[data-perk]');
                if (perkBtn) {
                    buyPerk(perkBtn.dataset.perk);
                    return;
                }

                if (e.target.closest('#btn-mad-arm')) {
                    save.world.madArmed = !save.world.madArmed;
                    sound.playClick();
                    dirtyUI = true;
                    updateUI();
                    return;
                }

                if (e.target.closest('#btn-mad-go')) {
                    triggerMadReset();
                    return;
                }

                if (e.target.closest('#btn-prestige-go')) {
                    triggerPrestige();
                    return;
                }

                if (e.target.closest('#btn-toggle-done-tech')) {
                    hideResearchedTechs = !hideResearchedTechs;
                    dirtyUI = true;
                    updateUI();
                    return;
                }

                if (e.target.closest('#btn-set-sound')) {
                    save.settings.sound = !save.settings.sound;
                    dirtyUI = true;
                    updateUI();
                    return;
                }

                if (e.target.closest('#btn-set-crt')) {
                    save.settings.crt = !save.settings.crt;
                    applySettings();
                    dirtyUI = true;
                    updateUI();
                    return;
                }

                if (e.target.closest('#btn-set-save')) {
                    saveGame(true);
                    return;
                }

                if (e.target.closest('#btn-set-export')) {
                    exportSaveCode();
                    return;
                }

                if (e.target.closest('#btn-set-import')) {
                    importSaveCode();
                    return;
                }

                if (e.target.closest('#btn-set-reset')) {
                    hardResetGame();
                    return;
                }
            });

            // 6. 模态框关闭与切后台自动保存
            document.getElementById('modal-close-x').addEventListener('click', closeModal);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) saveGame(false);
            });
        }

        window.addEventListener('load', () => {
            initFloatPool();
            buildLeftResourceCards();
            recomputeCapacities();
            loadGame();
            ensureEvolveWorldFields();
            applySettings();
            bindEvents();
            renderPixelScene();
            dirtyUI = true;
            updateUI();

            // 250ms 固定逻辑 Tick（与数值配置手册一致）
            setInterval(() => {
                if (document.hidden) return;
                recomputeCapacities();
                stepSimulation(0.25);
                checkMissions();
                checkEraAdvancement();
                updateUI();
            }, 250);

            // 每 30 秒自动存档
            setInterval(() => {
                if (!document.hidden) saveGame(false);
            }, 30000);

            // 严格节流 15 FPS 像素画布渲染循环（后台自动休眠）
            let lastFrameTime = 0;
            const frameInterval = 1000 / 15;
            function animationLoop(now) {
                if (!document.hidden && now - lastFrameTime >= frameInterval) {
                    lastFrameTime = now;
                    renderPixelScene();
                }
                requestAnimationFrame(animationLoop);
            }
            requestAnimationFrame(animationLoop);
        });
    </script>
</body>
</html>
