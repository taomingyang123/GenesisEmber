<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>像素人类纪元：从RNA到核威慑与星际方舟 (Evolve 增强版)</title>
    <style>
        /* =====================================================================
           1. 纯像素街机终端全局样式（零外部依赖，自适应PC双栏 & 移动端单屏）
           ===================================================================== */
        :root {
            --bg-main: #0b0f17;
            --bg-panel: #111827;
            --bg-card: #161f33;
            --bg-card-hover: #1e293b;
            --border-dim: #263248;
            --border-bright: #3b4d6b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --accent-emerald: #10b981;
            --accent-sky: #38bdf8;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
            --accent-rose: #f43f5e;
            --accent-indigo: #6366f1;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            line-height: 1.4;
        }

        /* 像素风格边框与按钮 */
        .pixel-box {
            background-color: var(--bg-panel);
            border: 2px solid var(--border-dim);
            border-radius: 4px;
        }

        .pixel-card {
            background-color: var(--bg-card);
            border: 2px solid var(--border-dim);
            border-radius: 4px;
            transition: border-color 0.12s ease, background-color 0.12s ease;
        }

        .pixel-btn {
            font-family: var(--font-mono);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-bottom-width: 3px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.06s ease, filter 0.1s ease;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .pixel-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .pixel-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(0.4);
        }

        /* 可选 CRT 扫描线（默认关闭以保持低功耗与清晰度） */
        body.crt-enabled::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.16) 0px,
                rgba(0, 0, 0, 0.16) 1px,
                transparent 1px,
                transparent 3px
            );
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f17;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b3952;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3e5275;
        }

        /* =====================================================================
           2. 整体布局骨架（PC 双栏 vs 移动端单屏锁定）
           ===================================================================== */
        #app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            height: 100dvh;
            padding: env(safe-area-inset-top, 4px) 6px env(safe-area-inset-bottom, 4px) 6px;
            gap: 6px;
            max-width: 1440px;
            margin: 0 auto;
        }

        /* 顶部状态与任务栏 */
        #top-header {
            flex-shrink: 0;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .header-row-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            flex-wrap: wrap;
        }

        .era-badge-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .era-icon-box {
            width: 34px;
            height: 34px;
            background: #17253b;
            border: 2px solid #334a6e;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .kpi-strip {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .kpi-pill {
            background: #0d1422;
            border: 1px solid #26354d;
            border-radius: 4px;
            padding: 3px 7px;
            display: flex;
            flex-direction: column;
            min-width: 96px;
            flex-shrink: 0;
            cursor: pointer;
            overflow: hidden;
        }

        .kpi-pill.prestige-pill {
            background: #241238;
            border-color: #6b21a8;
        }

        .kpi-label {
            font-size: 10px;
            color: var(--text-muted);
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .kpi-val {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }

        .mission-banner {
            background: #0d1526;
            border: 1px solid #283b59;
            border-radius: 4px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 11px;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }

        .mission-banner:hover {
            border-color: #38bdf8;
        }

        /* 主工作区 */
        #main-workspace {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 左侧舞台 + 全资源监控区 */
        #left-pane {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 6px;
            flex-shrink: 0;
        }

        .stage-top-row {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        /* 紧凑正方形像素舞台 */
        #canvas-wrapper {
            position: relative;
            width: 112px;
            height: 112px;
            flex-shrink: 0;
            border: 2px solid #384e73;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            background: #071318;
            touch-action: manipulation;
        }

        #pixel-canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .canvas-caption {
            position: absolute;
            bottom: 3px;
            left: 3px;
            right: 3px;
            background: rgba(8, 13, 22, 0.82);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #6ee7b7;
            font-size: 10px;
            text-align: center;
            padding: 1px 2px;
            border-radius: 2px;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stage-info-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 4px;
        }

        .click-hint-badge {
            background: rgba(16, 185, 129, 0.14);
            border: 1px solid rgba(16, 185, 129, 0.45);
            color: #6ee7b7;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 3px;
            text-align: center;
            cursor: pointer;
        }

        .era-lore-text {
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.35;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .stage-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
            border-top: 1px dashed #26354d;
            padding-top: 3px;
        }

        /* 左侧全文明资源库存监控区 */
        #left-res-section {
            display: flex;
            flex-direction: column;
            background: #0c121e;
            border: 1px solid #24324a;
            border-radius: 4px;
            padding: 5px;
            min-height: 0;
            max-height: 102px;
        }

        .res-section-hdr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
            color: #38bdf8;
            padding-bottom: 4px;
            margin-bottom: 4px;
            border-bottom: 1px solid #1e293b;
            flex-shrink: 0;
        }

        #left-res-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 4px;
            align-content: start;
        }

        .res-mini-card {
            background: #131c2e;
            border: 1px solid #233149;
            border-radius: 3px;
            padding: 3px 5px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            font-size: 11px;
            cursor: pointer;
            overflow: hidden;
        }

        .res-mini-card:hover {
            border-color: #38bdf8;
        }

        .res-mini-left {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .res-mini-name {
            font-weight: 700;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .res-mini-cap {
            font-size: 10px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }

        .res-mini-right {
            text-align: right;
            min-width: 56px;
            max-width: 48%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .res-mini-rate {
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }

        .res-mini-eta {
            font-size: 9px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }

        /* 左下双按钮操作栏 */
        .left-action-bar {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 6px;
            flex-shrink: 0;
        }

        .action-main-btn {
            min-width: 0;
            min-height: 42px;
            padding: 4px 6px;
            flex-direction: column;
            gap: 1px;
            text-align: center;
            overflow: hidden;
        }

        .action-main-btn > span {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }

        /* 右侧 5 独立功能面板 */
        #right-pane {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-bar {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 3px;
            padding: 4px;
            background: #0d1320;
            border-bottom: 2px solid var(--border-dim);
            flex-shrink: 0;
        }

        .tab-btn {
            position: relative;
            min-height: 44px;
            padding: 4px 2px;
            background: #162033;
            border: 1px solid #293852;
            border-radius: 4px;
            color: #94a3b8;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            touch-action: manipulation;
        }

        .tab-btn.active {
            background: #1e2d4a;
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: inset 0 -2px 0 #38bdf8;
        }

        .tab-badge {
            position: absolute;
            top: 3px;
            right: 4px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            display: none;
        }

        .tab-badge.show {
            display: block;
        }

        #tab-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 浮动文字对象池 */
        .float-text {
            position: fixed;
            pointer-events: none;
            z-index: 900;
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 13px;
            color: #6ee7b7;
            text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            opacity: 0;
            transform: translate3d(0, 0, 0);
            will-change: transform, opacity;
        }

        .float-text.anim {
            animation: floatUpAnim 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatUpAnim {
            0% {
                opacity: 1;
                transform: translate3d(-50%, 0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate3d(-50%, -38px, 0) scale(1.08);
            }
        }

        /* 自定义模态框与提示条 */
        #toast-bar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%) translateY(-120%);
            background: #0f172a;
            border: 2px solid #38bdf8;
            color: #f8fafc;
            padding: 7px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            z-index: 1000;
            transition: transform 0.2s ease;
            pointer-events: none;
            max-width: 92vw;
            text-align: center;
        }

        #toast-bar.show {
            transform: translateX(-50%) translateY(0);
        }

        #modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 15, 0.82);
            z-index: 950;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        #modal-backdrop.open {
            display: flex;
        }

        .modal-card {
            width: 100%;
            max-width: 460px;
            background: #111827;
            border: 2px solid #38bdf8;
            border-radius: 6px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-textarea {
            width: 100%;
            height: 96px;
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #38bdf8;
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 8px;
            resize: none;
            user-select: text;
        }

        /* =====================================================================
           3. PC 端宽屏街机双栏布局 (>= 768px)
           ===================================================================== */
        @media (min-width: 768px) {
            #app-shell {
                padding: 8px 10px;
                gap: 8px;
            }

            #main-workspace {
                flex-direction: row;
                align-items: stretch;
                gap: 8px;
            }

            #left-pane {
                width: 390px;
                flex-shrink: 0;
                padding: 8px;
                gap: 8px;
            }

            #canvas-wrapper {
                width: 212px;
                height: 212px;
            }

            .era-lore-text {
                -webkit-line-clamp: 6;
                font-size: 11.5px;
            }

            /* 左侧下方资源区域在 PC 端拉高占据全部剩余高度 */
            #left-res-section {
                flex: 1;
                max-height: none;
                padding: 7px;
            }

            .tab-btn {
                flex-direction: row;
                min-height: 40px;
                font-size: 12px;
                gap: 5px;
                white-space: nowrap;
            }
        }

        @media (min-width: 768px) and (max-width: 980px) {
            #left-pane { width: 320px; }
            #canvas-wrapper { width: 140px; height: 140px; }
            .tab-btn { font-size: 10.5px; gap: 3px; padding: 4px; }
            .subtab-btn { font-size: 10.5px; padding: 3px 6px; }
        }

        @media (max-width: 767px) {
            #app-shell { padding: 4px; gap: 4px; }
            #top-header { padding: 4px 6px; gap: 3px; }
            .kpi-pill { min-width: 78px; flex: 1 1 auto; padding: 3px 6px; }
            #left-pane { padding: 5px; gap: 4px; }
            #canvas-wrapper { width: 88px; height: 88px; }
            #left-res-section { max-height: 76px; padding: 4px; }
            .action-main-btn { min-height: 36px; padding: 3px 5px; }
            .subtab-bar { gap: 3px; padding: 3px 4px; }
            .subtab-btn { font-size: 10px; padding: 3px 4px; min-height: 24px; flex: 1 1 0; text-align: center; }
        }

        /* 通用工具类 */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-1 { gap: 4px; }
        .gap-2 { gap: 8px; }
        .flex-wrap { flex-wrap: wrap; }
        .min-w-0 { min-width: 0; }
        .shrink-0 { flex-shrink: 0; }
        .w-full { width: 100%; }
        .text-xs { font-size: 12px; }
        .text-11 { font-size: 11px; }
        .text-10 { font-size: 10px; }
        .font-bold { font-weight: 700; }
        .text-emerald { color: #34d399; }
        .text-sky { color: #38bdf8; }
        .text-amber { color: #fbbf24; }
        .text-purple { color: #c084fc; }
        .text-rose { color: #fb7185; }
        .text-muted { color: #94a3b8; }
        .text-dim { color: #64748b; }
        .hidden { display: none !important; }

        .bg-emerald { background: #059669; color: #fff; }
        .bg-sky { background: #0284c7; color: #fff; }
        .bg-indigo { background: #4f46e5; color: #fff; }
        .bg-amber { background: #d97706; color: #fff; }
        .bg-purple { background: #7e22ce; color: #fff; }
        .bg-rose { background: #e11d48; color: #fff; }
        .bg-slate { background: #334155; color: #cbd5e1; }

        /* 顶部历法气象微型条与右侧子页签条 */
        .weather-strip {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: var(--text-muted);
            background: rgba(8, 13, 24, 0.45);
            border: 1px solid var(--border-dim);
            border-radius: 3px;
            padding: 2px 7px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            cursor: pointer;
        }
        .weather-strip::-webkit-scrollbar { display: none; }

        .subtab-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-dim);
            overflow-x: auto;
            white-space: nowrap;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .subtab-bar::-webkit-scrollbar { display: none; }

        .subtab-btn {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            min-height: 26px;
            border-radius: 3px;
            border: 1px solid var(--border-dim);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .subtab-btn.active {
            background: #1e3a5f;
            border-color: #38bdf8;
            color: #ffffff;
        }

        /* 亮色主题对比度适配 (light / gruvboxLight) */
        body.theme-light-mode .pixel-box,
        body.theme-light-mode .kpi-pill,
        body.theme-light-mode .mission-banner,
        body.theme-light-mode #left-res-section,
        body.theme-light-mode .res-mini-card,
        body.theme-light-mode .tab-bar,
        body.theme-light-mode .tab-btn {
            background-color: var(--bg-panel);
            color: var(--text-main);
        }
        body.theme-light-mode .tab-btn.active,
        body.theme-light-mode .subtab-btn.active {
            background-color: #0284c7;
            color: #ffffff;
        }
        body.theme-light-mode .subtab-btn {
            background-color: #f1f5f9;
            color: #334155;
            border-color: #cbd5e1;
        }
        body.theme-light-mode .weather-strip {
            background: #e2e8f0;
            color: #334155;
            border-color: #cbd5e1;
        }
        body.theme-light-mode .click-hint-badge {
            color: #065f46;
            background: rgba(16, 185, 129, 0.16);
            border-color: #059669;
        }
        body.theme-light-mode #hdr-era-name,
        body.theme-light-mode #hdr-mission-text,
        body.theme-light-mode .res-mini-name,
        body.theme-light-mode .era-lore-text {
            color: var(--text-main) !important;
        }
        body.theme-light-mode .text-emerald { color: #047857; }
        body.theme-light-mode .text-sky { color: #0369a1; }
        body.theme-light-mode .text-amber { color: #b45309; }
        body.theme-light-mode .text-purple { color: #7e22ce; }
        body.theme-light-mode .text-rose { color: #be123c; }
    </style>
</head>
<body>
    <div id="app-shell">
        <!-- 顶部全局状态与主线任务栏 -->
        <header id="top-header" class="pixel-box">

           ===================================================================== */
        const sound = {
            ctx: null,
            ensure() {
                if (!save.settings.sound) return null;
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
                return this.ctx;
            },
            tone(freq, type, dur, vol = 0.08, delay = 0) {
                const ctx = this.ensure();
                if (!ctx) return;
                try {
                    const now = ctx.currentTime + delay;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + dur);
                } catch (_) {}
            },
            playClick() { this.tone(520, 'square', 0.045, 0.05); },
            playBuild() { this.tone(330, 'triangle', 0.06, 0.08); this.tone(495, 'triangle', 0.08, 0.08, 0.05); },

            },

            }
        };

        /* =====================================================================

        function fmt(n) {
            if (window.EvolveModules && window.EvolveModules.DataLoader) {
                return window.EvolveModules.DataLoader.formatNumber(n, (save.settings && save.settings.numFormat) || 'metric');
            }
            if (!isFinite(n)) return '0';
            const abs = Math.abs(n);
            if (abs >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (abs >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (abs >= 1e4) return (n / 1e3).toFixed(1) + 'K';
            if (abs >= 1e3) return (n / 1e3).toFixed(2) + 'K';
            return (n < 0 ? Math.ceil(n) : Math.floor(n)).toString();
        }

        function fmtRate(r) {
            if (!isFinite(r) || Math.abs(r) < 0.05) return '0.0/s';
            const sign = r > 0 ? '+' : '-';
            const abs = Math.abs(r);
            if (abs >= 1e9) return `${sign}${(abs / 1e9).toFixed(1)}G/s`;
            if (abs >= 1e6) return `${sign}${(abs / 1e6).toFixed(1)}M/s`;
            if (abs >= 1e3) return `${sign}${(abs / 1e3).toFixed(1)}K/s`;
            return `${sign}${abs.toFixed(1)}/s`;
        }

        let toastTimer = null;
        function showToast(msg) {
            const el = document.getElementById('toast-bar');
            if (!el) return;
            el.textContent = msg;
            el.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
        }

        function openModal({ title, bodyHtml, showTextarea = false, textareaValue = '', readonly = false, buttons = [] }) {
            const backdrop = document.getElementById('modal-backdrop');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            const ta = document.getElementById('modal-textarea');
            if (showTextarea) {
                ta.classList.remove('hidden');
                ta.value = textareaValue;
                ta.readOnly = readonly;
            } else {
                ta.classList.add('hidden');
            }
            const footer = document.getElementById('modal-footer');
            footer.innerHTML = '';
            buttons.forEach(btn => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = `pixel-btn ${btn.cls || 'bg-slate'}`;
                b.style.padding = '6px 12px';
                b.style.flex = '1';
                b.textContent = btn.text;
                b.onclick = () => {
                    if (btn.onClick) btn.onClick(ta.value);
                    if (btn.close !== false) closeModal();
                };
                footer.appendChild(b);
            });
            backdrop.classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.remove('open');
        }

        /* =====================================================================
           5. 固定对象池（最多 8 个浮动文字 + 最多 16 个像素粒子）
           ===================================================================== */
        const floatPool = [];
        let floatPoolIdx = 0;

        function initFloatPool() {
            for (let i = 0; i < 8; i++) {
                const el = document.createElement('div');
                el.className = 'float-text';
                document.body.appendChild(el);
                floatPool.push(el);
            }
        }

        function spawnFloatText(clientX, clientY, text, color = '#6ee7b7') {
            if (!floatPool.length) return;
            const el = floatPool[floatPoolIdx];
            floatPoolIdx = (floatPoolIdx + 1) % floatPool.length;
            el.textContent = text;
            el.style.color = color;
            el.style.left = `${clientX}px`;
            el.style.top = `${clientY}px`;
            el.style.opacity = '1';
            el.classList.remove('anim');
            void el.offsetWidth;
            el.classList.add('anim');
        }

        const PARTICLE_MAX = 16;
        const particlePool = Array.from({ length: PARTICLE_MAX }, () => ({
            active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, color: '#34d399'
        }));
        let particleIdx = 0;

        function spawnParticles(nx, ny, color = '#6ee7b7') {
            const px = Math.floor(nx * 64);
            const py = Math.floor(ny * 64);
            for (let i = 0; i < 4; i++) {
                const p = particlePool[particleIdx];
                particleIdx = (particleIdx + 1) % PARTICLE_MAX;
                p.active = true;
                p.x = px;
                p.y = py;
                p.vx = (Math.random() - 0.5) * 18;
                p.vy = -8 - Math.random() * 14;
                p.life = 0.45;
                p.color = color;
            }
        }

        /* =====================================================================
           6. 核心数值计算（容量、细胞结构、建筑价格、人口增长、电力、工业配方、任务、双轨转生）
           ===================================================================== */
        function getPerkLevel(id) {
            return save.prestige.perks[id] || 0;
        }

        function getShardMultiplier() {
            const lifetime = save.prestige.lifetimeShards || save.prestige.genesisShards || 0;
            const phage = save.prestige.phage || 0;
            // 每枚质粒/余烬 +2%，每枚噬菌体额外提升 +3%
            return 1 + lifetime * 0.02 + phage * 0.03;
        }

        /* 计算 Evolve 细胞结构单次购买成本（还原 main.js Si 线性递增公式） */
        function getCellStructureCost(cellDef) {
            ensureEvolveWorldFields();
            const w = save.world;
            const cnt = w.evoCells[cellDef.id] || 0;
            const isMulticellular = !!w.techs.evo_multicellular;
            const incRna = (cellDef.id === 'nucleus' && isMulticellular) ? cellDef.incRnaMulti : cellDef.incRna;
            const incDna = (cellDef.id === 'nucleus' && isMulticellular) ? cellDef.incDnaMulti : cellDef.incDna;
            const cost = {};
            if (cellDef.baseRna > 0) cost.rna = cellDef.baseRna + cnt * incRna;
            if (cellDef.baseDna > 0) cost.dna = cellDef.baseDna + cnt * incDna;
            return cost;
        }

        function buyCellStructure(cellId) {
            ensureEvolveWorldFields();
            const w = save.world;
            const cDef = EVOLVE_CELL_STRUCTURES_DEF.find(c => c.id === cellId);
            if (!cDef) return;
            if (cDef.reqEvo && !w.techs[cDef.reqEvo]) return;
            const cost = getCellStructureCost(cDef);
            if (!canAffordCost(cost)) return;

            payCost(cost);
            w.evoCells[cellId] = (w.evoCells[cellId] || 0) + 1;
            sound.playBuild();
            recomputeCapacities();
            checkMissions();
            dirtyUI = true;
            updateUI();
        }

        function addResourceClamped(id, delta) {
            const w = save.world;
            const cap = metrics.caps[id] || (RES_MAP[id] ? RES_MAP[id].baseCap : 100);
            const next = Math.max(0, Math.min(cap, (w.res[id] || 0) + delta));
            w.res[id] = next;
            if (next > 0) w.unlockedRes[id] = true;
        }

        function recomputeCapacities() {
            ensureEvolveWorldFields();
            const w = save.world;
            const b = w.buildings;
            const eb = w.extraBlds;
            const t = w.techs;
            const cells = w.evoCells;
            const phageStorageMult = 1 + (save.prestige.phage || 0) * 0.05;
            const caps = {};

            RESOURCES_DEF.forEach(r => {
                caps[r.id] = r.baseCap;
            });

            // 1. 生命起源阶段：细胞膜、真核细胞与线粒体的真实联动扩容 (源自 main.js d.evolution)
            const mitoCnt = cells.mitochondria || 0;
            const memPerLevel = 5 + mitoCnt * 5;
            const eukPerLevel = 10 + mitoCnt * 10;
            caps.rna += (cells.membrane || 0) * memPerLevel + (save.prestige.madCount > 0 ? 50 : 0);
            caps.dna += (cells.eukaryotic_cell || 0) * eukPerLevel;

            // 2. 仓库扩容：食物+200、木材+150、石材+150
            const wh = b.warehouse || 0;
            if (wh > 0) {
                caps.food += wh * 200;
                caps.lumber += wh * 150;
                caps.stone += wh * 150;
            }

            // 3. 货运仓库扩容：全部矿产/加工/工业/高科技/太空资源 +300/座
            const fwh = b.freightWarehouse || 0;
            if (fwh > 0) {
                RESOURCES_DEF.forEach(r => {
                    if (r.era >= 2 && r.id !== 'money' && r.id !== 'knowledge') {
                        caps[r.id] += fwh * 300;
                    }
                });
            }

            // 4. 银行、图书馆、大学、沃登克里弗塔、生命科学实验室、工业研究中心、数据中心、AI超算扩容
            caps.money += (b.bank || 0) * 10000;
            caps.knowledge += (b.library || 0) * 250;
            caps.knowledge += (b.university || 0) * 2000;
            caps.knowledge += (eb.wardenclyffe || 0) * 2500;
            caps.knowledge += (eb.biolab || 0) * 5000;
            caps.knowledge += (b.researchCenter || 0) * 10000;
            caps.knowledge += (b.datacenter || 0) * 30000;
            caps.money += (b.datacenter || 0) * 30000;
            caps.knowledge += (b.supercomputer || 0) * 100000;
            caps.money += (b.supercomputer || 0) * 100000;

            if (phageStorageMult > 1) {
                Object.keys(caps).forEach(k => {
                    if (k !== 'rna' && k !== 'dna') {
                        caps[k] = Math.round(caps[k] * phageStorageMult);
                    }
                });
            }

            // 5. 住房容量上限（简陋居所+5、茅屋+3、现代公寓+6、火星殖民穹顶+25，建筑学+10%）
            let rawPopCap = (b.primitiveHut || 0) * 5
                + (eb.cottage || 0) * 3
                + (eb.apartment || 0) * 6
                + (b.marsColony || 0) * 25;
            if (t.construction) rawPopCap = Math.floor(rawPopCap * 1.10);

            if (window.EvolveModules && window.EvolveModules.Bridge) {
                rawPopCap = window.EvolveModules.Bridge.applyExtendedCapacities(getHostApi(), caps, rawPopCap);
            }
            metrics.caps = caps;
            metrics.popCap = rawPopCap;

            // 同步解锁当前时代及已研究科技对应的资源可见性
            RESOURCES_DEF.forEach(r => {
                if (r.era <= w.eraIndex) {
                    if (r.id === 'copper' && !t.copperAge && w.eraIndex < 3) return;
                    if (r.id === 'iron' && !t.ironAge && w.eraIndex < 3) return;
                    if (r.id === 'coal' && !t.advancedMining && w.eraIndex < 3) return;
                    if ((r.id === 'plywood' || r.id === 'brick' || r.id === 'wroughtIron') && !t.smelting && w.eraIndex < 3) return;
                    if (r.id === 'money' && !t.currency && w.eraIndex < 3) return;
                    w.unlockedRes[r.id] = true;
                }
            });
        }

        function getBuildingCostDiscount() {
            const w = save.world;
            let mult = w.techs.mathematics ? 0.97 : 1.0;
            if (w.kingdom === 'fungi') mult *= 0.96;
            if (w.species === 'dwarf') mult *= 0.95;
            if (envMods && envMods.buildCostMult) mult *= envMods.buildCostMult;
            return mult;
        }

        /* 计算建筑购买 k 座的逐座向上取整总费用 */
        function getBuildingCost(bDef, countToBuy, isExtra = false) {
            const store = isExtra ? save.world.extraBlds : save.world.buildings;
            const owned = store[bDef.id] || 0;
            const discount = getBuildingCostDiscount();
            const total = {};
            for (const resId of Object.keys(bDef.baseCost)) {
                total[resId] = 0;
            }
            for (let i = 0; i < countToBuy; i++) {
                const n = owned + i;
                for (const [resId, baseVal] of Object.entries(bDef.baseCost)) {
                    total[resId] += Math.ceil(baseVal * Math.pow(bDef.growth, n) * discount);
                }
            }
            return total;
        }

        function getMaxAffordableBuilding(bDef, isExtra = false) {
            const store = isExtra ? save.world.extraBlds : save.world.buildings;
            const owned = store[bDef.id] || 0;
            const maxAllowed = bDef.maxCount ? Math.max(0, bDef.maxCount - owned) : 200;
            if (maxAllowed <= 0) return 0;

            const discount = getBuildingCostDiscount();
            const running = {};
            for (const resId of Object.keys(bDef.baseCost)) running[resId] = 0;

            let canBuy = 0;
            for (let i = 0; i < maxAllowed; i++) {
                const n = owned + i;
                let ok = true;
                for (const [resId, baseVal] of Object.entries(bDef.baseCost)) {
                    const stepCost = Math.ceil(baseVal * Math.pow(bDef.growth, n) * discount);
                    if ((save.world.res[resId] || 0) < running[resId] + stepCost) {
                        ok = false;
                        break;
                    }
                }
                if (!ok) break;
                for (const [resId, baseVal] of Object.entries(bDef.baseCost)) {
                    running[resId] += Math.ceil(baseVal * Math.pow(bDef.growth, n) * discount);
                }
                canBuy++;
            }
            return canBuy;
        }

        function getEffectiveTechCost(tDef) {
            const w = save.world;
            let knowMult = 1.0;
            if (w.species === 'human') knowMult *= 0.95;
            if (w.gov === 'technocracy') knowMult *= 0.92;
            if (envMods && envMods.techKnowCostMult) knowMult *= envMods.techKnowCostMult;
            const out = {};
            for (const [rId, amt] of Object.entries(tDef.cost)) {
                out[rId] = (rId === 'knowledge') ? Math.max(1, Math.floor(amt * knowMult)) : amt;
            }
            return out;
        }

        function canAffordCost(costObj) {
            for (const [resId, amt] of Object.entries(costObj)) {
                if ((save.world.res[resId] || 0) < amt) return false;
            }
            return true;
        }

        function payCost(costObj) {
            for (const [resId, amt] of Object.entries(costObj)) {
                save.world.res[resId] = Math.max(0, (save.world.res[resId] || 0) - amt);
            }
        }

        /* 主动吸引流民（消耗盈余食物立即 +2 人口） */
        function getRecruitFoodCost() {
            const pop = Math.max(0, Math.floor(save.world.pop));
            return Math.floor(150 * Math.pow(1.04, Math.max(0, pop - 2)));
        }

        function recruitPopulation() {
            const w = save.world;
            if (w.eraIndex < 1) return;
            recomputeCapacities();
            const curPop = Math.floor(w.pop);
            const vacant = Math.max(0, metrics.popCap - curPop);
            const cost = getRecruitFoodCost();
            if (vacant <= 0 || (w.res.food || 0) < cost) return;

            const gain = Math.min(2, vacant);
            w.res.food -= cost;
            w.pop = Math.min(metrics.popCap, curPop + gain);
            sound.playBuild();

            const wrap = document.getElementById('canvas-wrapper');
            if (wrap) {
                const rect = wrap.getBoundingClientRect();
                spawnFloatText(rect.left + rect.width * 0.5, rect.top + rect.height * 0.45, `+${gain} 人口`, '#38bdf8');
                spawnParticles(0.5, 0.45, '#38bdf8');
            }

            checkMissions();
            checkEraAdvancement();
            dirtyUI = true;
            updateUI();
        }

        /* 顺序主线任务检查（支持跨多级自动追溯与防重复发放） */
        function checkMissions() {
            const w = save.world;
            let anyCompleted = false;
            while (w.missionIndex < MISSIONS_DEF.length) {
                const m = MISSIONS_DEF[w.missionIndex];
                if (m.check(w)) {
                    w.missionIndex++;
                    anyCompleted = true;
                    if (m.reward && m.reward.res) {
                        for (const [rId, val] of Object.entries(m.reward.res)) {
                            w.unlockedRes[rId] = true;
                            addResourceClamped(rId, val);
                        }
                    }
                    const msg = `✅ 完成任务 [${m.id}] ${m.name}！`;
                    showToast(msg);
                    if (window.EvolveModules && window.EvolveModules.EventsAchieves) {
                        window.EvolveModules.EventsAchieves.addLog({ save }, 'progress', msg, 'emerald');
                    }
                } else {
                    break;
                }
            }
            if (anyCompleted) {
                recomputeCapacities();
                dirtyUI = true;
            }
        }

        /* 核心时代自动晋升校验 */
        function checkEraAdvancement() {
            const w = save.world;
            const t = w.techs;
            const b = w.buildings;
            let advanced = false;

            if (w.eraIndex === 0 && t.evo_sapiens) {
                w.eraIndex = 1;
                w.pop = 2;
                b.primitiveHut = (b.primitiveHut || 0) + 1;
                ['food', 'lumber', 'stone', 'knowledge'].forEach(id => { w.unlockedRes[id] = true; });
                recomputeCapacities();
                addResourceClamped('food', 40);
                addResourceClamped('lumber', 15);
                addResourceClamped('stone', 10);
                addResourceClamped('knowledge', 10);
                advanced = true;
            } else if (w.eraIndex === 1 && w.pop >= 45 && t.mining && t.mathematics && w.missionIndex >= 17) {
                w.eraIndex = 2;
                advanced = true;
            } else if (w.eraIndex === 2 && w.pop >= 120 && t.steel && (b.university || 0) >= 1 && w.missionIndex >= 26) {
                w.eraIndex = 3;
                advanced = true;
            } else if (w.eraIndex === 3 && t.electronics && (b.coalPowerPlant || 0) >= 1 && metrics.powerSurplus >= 10 && w.missionIndex >= 34) {
                w.eraIndex = 4;
                advanced = true;
            } else if (w.eraIndex === 4 && t.particlePhysics && (b.nuclearPowerPlant || 0) >= 1 && w.missionIndex >= 37) {
                w.eraIndex = 5;
                advanced = true;
            } else if (w.eraIndex === 5 && t.artificialIntelligence && (b.supercomputer || 0) >= 1 && w.missionIndex >= 43) {
                w.eraIndex = 6;
                advanced = true;
            }

            if (advanced) {
                recomputeCapacities();
                sound.playEra();
                const era = ERAS_DEF[w.eraIndex];
                const msg = `🎉 文明跃迁：进入【${era.name}】！`;
                showToast(msg);
                if (window.EvolveModules && window.EvolveModules.EventsAchieves) {
                    window.EvolveModules.EventsAchieves.addLog({ save }, 'progress', msg, 'amber');
                }
                dirtyUI = true;
            }
        }

        /* 单步模拟 Tick（dt 秒，融合《进化 Evolve》历法/天气/仓储/贸易/外交/ARPA/基因/总督/工业逻辑） */
        function stepSimulation(dt) {
            ensureEvolveWorldFields();
            const w = save.world;
            const b = w.buildings;
            const eb = w.extraBlds;
            const t = w.techs;
            const cells = w.evoCells;
            const shardMult = getShardMultiplier();
            const autoLv = getPerkLevel('automation');
            const eco = window.EvolveModules && window.EvolveModules.EconomyStorage;
            const activeCnt = (id, isEx = false) => eco ? eco.getActiveBuildingCount(w, id, isEx) : ((isEx ? eb[id] : b[id]) || 0);

            // 自动化天赋：自动将空闲人口分配至农民（保障粮食供给）
            if (w.eraIndex >= 1 && autoLv > 0) {
                const assigned = Object.values(w.jobs).reduce((a, c) => a + c, 0);
                const idle = Math.floor(w.pop) - assigned;
                if (idle > 0) {
                    w.jobs.farmer = (w.jobs.farmer || 0) + idle;
                }
            }

            const rates = {};
            RESOURCES_DEF.forEach(r => { rates[r.id] = 0; });

            // 1. 生命起源阶段：进化节点基础自动产出 + Evolve 细胞器/细胞核真实转录逻辑（进入农业时代后停用）
            if (w.eraIndex === 0) {
                let lifeMult = shardMult * (save.prestige.rapidMutation ? 2.0 : 1.0);
                if (t.evo_organelle) lifeMult *= 1.10;
                if (t.evo_nucleus) lifeMult *= 1.15;
                if (t.evo_multicellular) lifeMult *= 1.15;
                if (t.evo_vertebrate) lifeMult *= 1.20;
                if (t.evo_mammal) lifeMult *= 1.20;
                if (t.evo_primate) lifeMult *= 1.25;

                if (t.evo_organelle) rates.rna += 0.25 * lifeMult;
                if (t.evo_nucleus) rates.rna += 0.35 * lifeMult;
                if (t.evo_nucleus) rates.dna += 0.15 * lifeMult;
                if (t.evo_vertebrate) rates.dna += 0.25 * lifeMult;

                // Evolve 细胞器自动复制产生 RNA (organelles)
                const orgCnt = cells.organelles || 0;
                if (orgCnt > 0) {
                    const perOrg = (t.evo_organelle ? 2.0 : 1.0) * (save.prestige.rapidMutation ? 2.0 : 1.0);
                    rates.rna += orgCnt * perOrg * shardMult;
                }

                // Evolve 细胞核将 2 RNA 转化为 1~2 DNA (nucleus)
                const nucCnt = cells.nucleus || 0;
                if (nucCnt > 0 && (w.res.dna || 0) < (metrics.caps.dna || 150)) {
                    const rnaNeedPerSec = nucCnt * 2.0;
                    const availRna = (w.res.rna || 0) + Math.max(0, rates.rna * dt);
                    const ratio = rnaNeedPerSec * dt > 0 ? Math.min(1, availRna / (rnaNeedPerSec * dt)) : 0;
                    const dnaOutPerNuc = t.evo_vertebrate ? 2.0 : 1.0;
                    rates.rna -= rnaNeedPerSec * ratio;
                    rates.dna += nucCnt * dnaOutPerNuc * ratio * shardMult;
                }
            }

            let happyMult = 1.0;
            let powerRatio = 1.0;
            let foodNeed = 0;

            // 2. 农业及之后时代：物种特质、政体、税率、士气、职业、建筑、电力与工业配方
            if (w.eraIndex >= 1) {
                const ruinsMult = (save.prestige.ancientRuins && w.eraIndex <= 2) ? 1.25 : 1.0;
                const fedMult = w.gov === 'federation' ? 1.25 : 1.0;

                // 部落初始自发观察知识（防止农业刚开启时知识断路）
                rates.knowledge += 0.30 * shardMult * ruinsMult * fedMult;

                // 植物界叶绿体 / 特质修正市民粮食消耗
                const baseFoodPerPop = w.kingdom === 'plant' ? 0.15 : 0.20;
                foodNeed = w.pop * baseFoodPerPop * ((envMods && envMods.foodNeedMult) || 1.0);
                rates.food -= foodNeed;

                // 驻军狩猎补给与战利品 (garrison)
                const garCnt = eb.garrison || 0;
                if (garCnt > 0) {
                    const milMult = (w.kingdom === 'animal' ? 1.25 : 1) * (w.species === 'orc' ? 1.30 : 1) * (w.gov === 'autocracy' ? 1.18 : 1) * shardMult * fedMult;
                    rates.food += garCnt * 1.2 * milMult;
                    if (t.currency) rates.money += garCnt * 0.8 * milMult;
                }

                // 市民士气（由 EvolveModules.CalendarWeather 精细计算更新，这里同步获取当拍幸福乘数）
                const foodSat = foodNeed <= 0 ? 1 : Math.min(1, (w.res.food + Math.max(0, rates.food)) / Math.max(0.1, foodNeed));
                if (w.happiness >= 120) happyMult = 1.25;
                else if (w.happiness >= 90) happyMult = 1.10;
                else if (w.happiness >= 70) happyMult = 1.00;
                else if (w.happiness >= 50) happyMult = 0.90;
                else if (w.happiness >= 30) happyMult = 0.75;
                else happyMult = 0.60;
                metrics.happyMult = happyMult;

                const agriMult = (1 + getPerkLevel('agriculturalRevolution') * 0.05) * (w.species === 'ent' ? 1.20 : 1) * fedMult;
                const lumberTraitMult = (w.kingdom === 'plant' ? 1.20 : 1) * (w.species === 'elf' ? 1.30 : (w.species === 'ent' ? 1.40 : 1)) * fedMult;
                const mineTraitMult = (w.kingdom === 'fungi' ? 1.20 : 1) * (w.species === 'dwarf' ? 1.25 : 1) * (w.gov === 'socialist' ? 1.22 : 1) * fedMult;
                const indPerkMult = (1 + getPerkLevel('industrialRevolution') * 0.05) * (w.gov === 'autocracy' ? 1.18 : (w.gov === 'socialist' ? 1.22 : 1)) * fedMult;
                const sciMult = (1 + getPerkLevel('scientificRevolution') * 0.06)
                    * (1 + (b.satelliteNetwork || 0) * 0.05)
                    * (t.particlePhysics ? 1.20 : 1)
                    * (t.internet ? 1.20 : 1)
                    * (w.species === 'human' ? 1.12 : (w.species === 'elf' ? 1.15 : 1))
                    * (w.gov === 'democracy' ? 1.12 : (w.gov === 'technocracy' ? 1.20 : 1))
                    * ruinsMult * fedMult;
                const moneyMult = (t.trade ? 1.20 : 1)
                    * (t.internet ? 1.20 : 1)
                    * (w.gov === 'democracy' ? 1.12 : (w.gov === 'oligarchy' ? 1.25 : 1))
                    * fedMult;

                // 市民纳税收入（研究【货币】后生效，公司官僚主义税收减半，社会主义略降）
                if (t.currency && w.pop > 0) {
                    let govTaxFactor = 1.0;
                    if (w.gov === 'oligarchy') govTaxFactor = 1.20;
                    else if (w.gov === 'corpocracy') govTaxFactor = 0.50;
                    else if (w.gov === 'socialist') govTaxFactor = 0.85;
                    const taxMult = govTaxFactor * moneyMult * happyMult * shardMult;
                    const taxInc = Math.floor(w.pop) * 0.16 * (w.taxRate / 20) * taxMult;
                    metrics.taxIncome = taxInc;
                    rates.money += taxInc;
                } else {
                    metrics.taxIncome = 0;
                }

                // 12 种职业产出与消耗
                JOBS_DEF.forEach(j => {
                    const workers = w.jobs[j.id] || 0;
                    if (workers <= 0) return;

                    let jobMult = happyMult * shardMult * ruinsMult;
                    if (j.id === 'farmer') jobMult *= (1 + (b.farmland || 0) * 0.20) * agriMult;
                    if (j.id === 'lumberjack') jobMult *= (1 + (b.lumberCamp || 0) * 0.25) * (t.tools ? 1.10 : 1) * lumberTraitMult;
                    if (j.id === 'quarryWorker') jobMult *= (1 + (b.quarry || 0) * 0.25) * (t.tools ? 1.10 : 1) * mineTraitMult;
                    if (j.id === 'scholar') jobMult *= (1 + (b.library || 0) * 0.20) * (t.writing ? 1.10 : 1) * sciMult;
                    if (j.id === 'professor') jobMult *= (1 + (b.university || 0) * 0.15) * sciMult;
                    if (j.id === 'scientist') jobMult *= sciMult;
                    if (j.id === 'miner') jobMult *= (1 + (b.mine || 0) * 0.10) * mineTraitMult;
                    if (j.id === 'coalMiner') jobMult *= (1 + (b.coalMine || 0) * 0.10) * mineTraitMult;
                    if (j.id === 'merchant' || j.id === 'engineer') jobMult *= moneyMult;
                    if (j.id === 'craftsman') jobMult *= (1 + (b.smelter || 0) * 0.15) * (1 + (b.foundry || 0) * 0.15) * indPerkMult * (w.species === 'dwarf' ? 1.25 : 1);

                    let inputScale = 1.0;
                    if (j.inRes) {
                        for (const [inId, perWorker] of Object.entries(j.inRes)) {
                            const need = workers * perWorker * dt;
                            if (need > 0 && (w.res[inId] || 0) < need) {
                                inputScale = Math.min(inputScale, (w.res[inId] || 0) / need);
                            }
                        }
                        for (const [inId, perWorker] of Object.entries(j.inRes)) {
                            rates[inId] -= workers * perWorker * inputScale;
                        }
                    }

                    for (const [outId, perWorker] of Object.entries(j.out)) {
                        let focusMult = 1.0;
                        if (j.id === 'craftsman' && w.craftFocus !== 'balanced') {
                            focusMult = (w.craftFocus === outId) ? 1.65 : 0.65;
                        }
                        rates[outId] += workers * perWorker * jobMult * inputScale * focusMult;
                    }
                });

                // 建筑直产资源
                const mineCnt = b.mine || 0;
                if (mineCnt > 0) {
                    rates.copper += mineCnt * 0.20 * shardMult * mineTraitMult;
                    rates.iron += mineCnt * 0.25 * shardMult * mineTraitMult;
                    if (t.aluminiumIndustry) rates.aluminium += mineCnt * 0.40 * shardMult * mineTraitMult;
                }
                if ((b.coalMine || 0) > 0) rates.coal += b.coalMine * 0.30 * shardMult * mineTraitMult;
                if ((b.market || 0) > 0) rates.money += b.market * 0.50 * moneyMult * shardMult;
                if ((eb.amphitheatre || 0) > 0) rates.knowledge += eb.amphitheatre * 0.50 * sciMult * shardMult;
                if ((b.researchCenter || 0) > 0) rates.knowledge += activeCnt('researchCenter') * 2.0 * sciMult * shardMult;
                if ((b.datacenter || 0) > 0) rates.knowledge += activeCnt('datacenter') * 10.0 * sciMult * shardMult;
                if ((b.moonBase || 0) > 0) rates.waterIce += b.moonBase * 0.40 * shardMult * fedMult;
                if ((b.marsColony || 0) > 0) rates.rareMineral += b.marsColony * 0.30 * shardMult * fedMult;

                // 电力系统：三类电厂燃料消耗与发电功率
                const energyMult = (1 + getPerkLevel('efficientEnergy') * 0.04) * (t.electricalEngineering ? 1.15 : 1) * ((envMods && envMods.powerMult) || 1.0);
                let totalGen = 0;

                const coalPlants = b.coalPowerPlant || 0;
                if (coalPlants > 0) {
                    const needCoal = coalPlants * 0.5 * dt;
                    const ratio = needCoal > 0 ? Math.min(1, (w.res.coal || 0) / needCoal) : 1;
                    rates.coal -= coalPlants * 0.5 * ratio;
                    totalGen += coalPlants * 20 * ratio * energyMult;
                }

                const nucPlants = b.nuclearPowerPlant || 0;
                if (nucPlants > 0) {
                    const needU = nucPlants * 0.1 * dt;
                    const ratio = needU > 0 ? Math.min(1, (w.res.uranium || 0) / needU) : 1;
                    rates.uranium -= nucPlants * 0.1 * ratio;
                    totalGen += nucPlants * 100 * ratio * energyMult;
                }

                const fusPlants = b.fusionPowerPlant || 0;
                if (fusPlants > 0) {
                    const needH3 = fusPlants * 0.05 * dt;
                    const ratio = needH3 > 0 ? Math.min(1, (w.res.helium3 || 0) / needH3) : 1;
                    rates.helium3 -= fusPlants * 0.05 * ratio;
                    totalGen += fusPlants * 500 * ratio * energyMult;
                }

                const gridDiscount = 1 - Math.min(0.20, (b.gridControl || 0) * 0.05);
                const extraPowerReq = (window.EvolveModules && window.EvolveModules.Bridge)
                    ? window.EvolveModules.Bridge.getExtraPowerReq(w) : 0;
                const rawPowerReq = (
                    activeCnt('steelMill') * 8 +
                    activeCnt('cementPlant') * 5 +
                    activeCnt('oilWell') * 3 +
                    activeCnt('refinery') * 6 +
                    activeCnt('factory') * 10 +
                    activeCnt('researchCenter') * 5 +
                    activeCnt('uraniumMine') * 10 +
                    activeCnt('cleanRoom') * 15 +
                    activeCnt('chipFab') * 20 +
                    activeCnt('datacenter') * 25 +
                    activeCnt('launchPad') * 15 +
                    activeCnt('helium3Harvester') * 20 +
                    activeCnt('apartment', true) * 1 +
                    activeCnt('wardenclyffe', true) * 2 +
                    activeCnt('biolab', true) * 2 +
                    extraPowerReq
                ) * gridDiscount;

                metrics.powerGen = totalGen;
                metrics.powerReq = rawPowerReq;
                metrics.powerSurplus = totalGen - rawPowerReq;
                powerRatio = rawPowerReq <= 0 ? 1 : Math.min(1, totalGen / rawPowerReq);
                metrics.powerRatio = powerRatio;

                // 沃登克里弗塔与生命科学实验室通电科研加成
                if (activeCnt('wardenclyffe', true) > 0) {
                    rates.knowledge += activeCnt('wardenclyffe', true) * 4.5 * Math.max(0.3, powerRatio) * sciMult * shardMult;
                }
                if (activeCnt('biolab', true) > 0) {
                    rates.knowledge += activeCnt('biolab', true) * 12.0 * Math.max(0.3, powerRatio) * sciMult * shardMult;
                }

                // 工业转化配方辅助函数（兼顾原料上限与电网供电比）
                let indOutputMult = indPerkMult * shardMult * (t.mechanicalEngineering ? 1.15 : 1);
                if (t.artificialIntelligence && (b.supercomputer || 0) >= 1) indOutputMult *= 1.25;

                const runRecipe = (count, inputs, outputs, usePower = true, extraMult = 1.0) => {
                    if (count <= 0) return;
                    const pScale = usePower ? powerRatio : 1;
                    if (pScale <= 0) return;
                    let inScale = 1;
                    for (const [inId, perUnit] of Object.entries(inputs)) {
                        const need = count * perUnit * pScale * dt;
                        if (need > 0 && (w.res[inId] || 0) < need) {
                            inScale = Math.min(inScale, (w.res[inId] || 0) / need);
                        }
                    }
                    const finalScale = pScale * inScale;
                    if (finalScale <= 0) return;
                    for (const [inId, perUnit] of Object.entries(inputs)) {
                        rates[inId] -= count * perUnit * finalScale;
                    }
                    for (const [outId, perUnit] of Object.entries(outputs)) {
                        rates[outId] += count * perUnit * finalScale * indOutputMult * extraMult;
                    }
                };

                // 初级加工设施（支持冶炼炉燃料模式切换与工匠焦点加成）
                let smelterBoost = 1.0;
                const smCnt = b.smelter || 0;
                if (smCnt > 0) {
                    if (w.smelterMode === 'oil' && (w.res.oil || 0) >= smCnt * 0.2 * dt) {
                        rates.oil -= smCnt * 0.2;
                        smelterBoost = 1.50;
                    } else if (w.smelterMode === 'coal' && (w.res.coal || 0) >= smCnt * 0.15 * dt) {
                        rates.coal -= smCnt * 0.15;
                        smelterBoost = 1.25;
                    }
                }
                runRecipe(smCnt, { iron: 0.7 }, { wroughtIron: 0.35 }, false, smelterBoost);
                runRecipe(b.foundry || 0, { lumber: 0.6, stone: 0.6 }, { plywood: 0.3, brick: 0.3 }, false);

                // 工业与高科技生产线（结合电力开关）
                runRecipe(activeCnt('steelMill'), { iron: 2, coal: 1 }, { steel: 1 }, true, smelterBoost);
                runRecipe(activeCnt('cementPlant'), { stone: 3 }, { cement: 1 }, true);
                runRecipe(activeCnt('oilWell'), {}, { oil: 1 }, true);
                runRecipe(activeCnt('refinery'), { oil: 2 }, { polymer: 1 }, true);

                const uMult = t.radioChemistry ? 1.20 : 1.0;
                runRecipe(activeCnt('uraniumMine'), {}, { uranium: 0.3 * uMult }, true);

                // 多功能工业厂房：电子元件 + 火箭部件协同生产
                const facCnt = activeCnt('factory');
                if (facCnt > 0 && t.electronics) {
                    if (t.rocketry) {
                        runRecipe(facCnt * 0.6, { aluminium: 1, polymer: 1 }, { electronics: 1 }, true);
                        runRecipe(facCnt * 0.4, { steel: 2, aluminium: 1, polymer: 1, electronics: 1 }, { rocketParts: 1 }, true);
                    } else {
                        runRecipe(facCnt, { aluminium: 1, polymer: 1 }, { electronics: 1 }, true);
                    }
                }

                runRecipe(activeCnt('cleanRoom'), { electronics: 1, polymer: 2 }, { wafer: 1 }, true);
                runRecipe(activeCnt('chipFab'), { wafer: 1, aluminium: 1 }, { microprocessor: 1 }, true);
                runRecipe(activeCnt('launchPad'), { steel: 1.2, aluminium: 0.6, polymer: 0.6, electronics: 0.6 }, { rocketParts: 0.6 }, true);
                runRecipe(activeCnt('helium3Harvester'), {}, { helium3: 0.5 }, true);

                // 繁荣度动态人口增长结算（基础 0.25/s + 空床位引力 + 粮食满仓繁荣倍率 + 环境与医院乘数）
                const popPerkMult = (1 + getPerkLevel('populationBonus') * 0.05) * (w.species === 'orc' ? 1.20 : 1) * ((envMods && envMods.popGrowthMult) || 1.0);
                const basePopRate = 0.25 * popPerkMult;
                const vacantBeds = Math.max(0, metrics.popCap - w.pop);
                const vacancyBonus = (vacantBeds / 10) * 0.15;
                const foodCap = metrics.caps.food || 500;
                const prosperityMult = (w.happiness >= 90 && (w.res.food || 0) >= foodCap * 0.5 && rates.food >= 0) ? 1.5 : 1.0;
                const canGrow = w.pop < metrics.popCap && ((w.res.food || 0) > 0 || foodSat >= 0.8);
                const totalPopRate = canGrow ? (basePopRate + vacancyBonus) * prosperityMult : 0;

                metrics.popBaseRate = basePopRate;
                metrics.popVacancyBonus = vacancyBonus;
                metrics.popProsperityMult = prosperityMult;
                metrics.popGrowthRate = totalPopRate;

                if (totalPopRate > 0) {
                    w.popAccum += totalPopRate * dt;
                    if (w.popAccum >= 1) {
                        const add = Math.floor(w.popAccum);
                        w.popAccum -= add;
                        w.pop = Math.min(metrics.popCap, w.pop + add);
                    }
                }
            }

            // 扩展系统单步结算（历法气象、环境精通乘数、市场贸易、外交战斗、ARPA/基因测序/总督、队列、事件与成就）
            if (window.EvolveModules && window.EvolveModules.Bridge) {
                window.EvolveModules.Bridge.stepExtendedSimulation(getHostApi(), dt, rates, {
                    happyMult,
                    shardMult,
                    powerRatio,
                    foodNeed
                });
            }

            // 统一提交各资源净变化（严格限幅在 [0, cap]）
            for (const r of RESOURCES_DEF) {
                const net = rates[r.id] || 0;
                metrics.netRates[r.id] = net;
                if (net !== 0) {
                    addResourceClamped(r.id, net * dt);
                }
            }
        }

        /* =====================================================================
           7. 手动交互动作（单次点击、空格采集、时代专属行动按钮）
           ===================================================================== */
        function handleStageManualClick(clientX, clientY) {
            ensureEvolveWorldFields();
            const w = save.world;
            w.clicks = (w.clicks || 0) + 1;
            sound.playClick();

            const shardMult = getShardMultiplier();
            const animalMult = w.kingdom === 'animal' ? 1.25 : 1.0;
            const orcMult = w.species === 'orc' ? 1.30 : 1.0;
            const rapidMult = (w.eraIndex === 0 && save.prestige.rapidMutation) ? 2.0 : 1.0;
            const clickMult = shardMult * (1 + getPerkLevel('automation') * 0.10) * (w.techs.tools ? 1.10 : 1) * animalMult * orcMult * rapidMult;
            let floatLabel = '+1 RNA';
            let floatColor = '#34d399';

            if (w.eraIndex === 0) {
                const gain = Math.max(1, Math.round(1 * clickMult));
                addResourceClamped('rna', gain);
                floatLabel = `+${gain} RNA`;
            } else if (w.eraIndex === 1) {
                const f = +(2 * clickMult).toFixed(1);
                const l = +(1.5 * clickMult).toFixed(1);
                const k = +(1 * clickMult).toFixed(1);
                addResourceClamped('food', f);
                addResourceClamped('lumber', l);
                addResourceClamped('knowledge', k);
                floatLabel = `+${f}粮 +${l}木 +${k}知`;
                floatColor = '#fbbf24';
            } else if (w.eraIndex === 2) {
                const m = Math.round(4 * clickMult);
                const k = Math.round(3 * clickMult);
                addResourceClamped('money', m);
                addResourceClamped('knowledge', k);
                if (w.techs.copperAge) addResourceClamped('copper', 1);
                if (w.techs.ironAge) addResourceClamped('iron', 1);
                floatLabel = `+${m}币 +${k}知`;
                floatColor = '#818cf8';
            } else if (w.eraIndex === 3) {
                const k = Math.round(15 * clickMult);
                const m = Math.round(12 * clickMult);
                addResourceClamped('knowledge', k);
                addResourceClamped('money', m);
                if (w.techs.steel) addResourceClamped('steel', 1);
                floatLabel = `+${k}知 +${m}币`;
                floatColor = '#f59e0b';
            } else if (w.eraIndex === 4) {
                const k = Math.round(50 * clickMult);
                addResourceClamped('knowledge', k);
                if (w.techs.nuclearFission) addResourceClamped('uranium', 0.5);
                floatLabel = `+${k}知 +0.5铀`;
                floatColor = '#34d399';
            } else if (w.eraIndex === 5) {
                const k = Math.round(200 * clickMult);
                const m = Math.round(150 * clickMult);
                addResourceClamped('knowledge', k);
                addResourceClamped('money', m);
                floatLabel = `+${k}知 +${m}币`;
                floatColor = '#38bdf8';
            } else {
                const k = Math.round(600 * clickMult);
                addResourceClamped('knowledge', k);
                if (w.techs.rocketry) addResourceClamped('rocketParts', 1);
                floatLabel = `+${k}知 +1部件`;
                floatColor = '#c084fc';
            }

            const wrap = document.getElementById('canvas-wrapper');
            if (wrap) {
                const rect = wrap.getBoundingClientRect();
                const cx = clientX ?? (rect.left + rect.width * 0.5);
                const cy = clientY ?? (rect.top + rect.height * 0.45);
                spawnFloatText(cx, cy, floatLabel, floatColor);
                const nx = Math.max(0.1, Math.min(0.9, (cx - rect.left) / rect.width));
                const ny = Math.max(0.1, Math.min(0.9, (cy - rect.top) / rect.height));
                spawnParticles(nx, ny, floatColor);
            }

            checkMissions();
            checkEraAdvancement();
            updateUI();
        }

        function handleEraActionButton() {
            ensureEvolveWorldFields();
            const w = save.world;
            const wrap = document.getElementById('canvas-wrapper');
            const rect = wrap.getBoundingClientRect();
            const cx = rect.left + rect.width * 0.5;
            const cy = rect.top + rect.height * 0.4;

            if (w.eraIndex === 0) {
                if (w.techs.evo_membrane) {
                    if ((w.res.rna || 0) >= 2 && (w.res.dna || 0) < (metrics.caps.dna || 150)) {
                        w.res.rna -= 2;
                        const gain = save.prestige.rapidMutation ? 2 : 1;
                        addResourceClamped('dna', gain);
                        sound.playTech();
                        spawnFloatText(cx, cy, `+${gain} DNA (-2 RNA)`, '#34d399');
                        spawnParticles(0.5, 0.5, '#34d399');
                    } else {
                        showToast('RNA 不足 2 或 DNA 已达上限！');
                    }
                } else {
                    const gain = save.prestige.rapidMutation ? 4 : 2;
                    addResourceClamped('rna', gain);
                    sound.playClick();
                    spawnFloatText(cx, cy, `+${gain} RNA`, '#34d399');
                    spawnParticles(0.5, 0.5, '#34d399');
                }
            } else if (w.eraIndex === 1) {
                addResourceClamped('lumber', 2.5);
                addResourceClamped('stone', 1.5);
                addResourceClamped('knowledge', 1.5);
                sound.playClick();
                spawnFloatText(cx, cy, '+2.5木 +1.5石 +1.5知', '#fbbf24');
                spawnParticles(0.5, 0.5, '#fbbf24');
            } else {
                handleStageManualClick(cx, cy);
                return;
            }

            checkMissions();
            checkEraAdvancement();
            updateUI();
        }

        /* =====================================================================
           8. 购买科技、建造建筑、分配职业与双轨转生（核弹 MAD + 恒星际殖民方舟）
           ===================================================================== */
        function buyTechnology(techId) {
            const w = save.world;
            const tDef = TECH_MAP[techId];
            if (!tDef || w.techs[techId]) return false;
            if (!tDef.req.every(r => !!w.techs[r])) return false;
            const effCost = getEffectiveTechCost(tDef);
            if (!canAffordCost(effCost)) return false;

            payCost(effCost);
            w.techs[techId] = true;
            sound.playTech();
            const msg = `🔬 研究完成：【${tDef.name}】`;
            showToast(msg);
            if (window.EvolveModules && window.EvolveModules.EventsAchieves) {
                window.EvolveModules.EventsAchieves.addLog({ save }, 'progress', msg, 'sky');
            }

            recomputeCapacities();
            checkMissions();
            checkEraAdvancement();
            dirtyUI = true;
            updateUI();
            return true;
        }

        function buyBuilding(bId, isExtra = false, batchOverride = null) {
            ensureEvolveWorldFields();
            const w = save.world;
            const store = isExtra ? w.extraBlds : w.buildings;
            const bDef = isExtra ? getExtraBuildingDef(bId) : BUILDINGS_DEF.find(b => b.id === bId);
            if (!bDef) return false;
            if (bDef.reqTech && !w.techs[bDef.reqTech]) return false;

            const owned = store[bId] || 0;
            const maxAllowed = bDef.maxCount ? Math.max(0, bDef.maxCount - owned) : 200;
            if (maxAllowed <= 0) return false;

            const effBatch = batchOverride || getEffectiveBatch();
            let qty = effBatch === 'MAX' ? getMaxAffordableBuilding(bDef, isExtra) : Math.min(effBatch, maxAllowed);
            if (qty <= 0) return false;

            const cost = getBuildingCost(bDef, qty, isExtra);
            if (!canAffordCost(cost)) return false;

            payCost(cost);
            store[bId] = owned + qty;
            sound.playBuild();
            showToast(`🏛️ 建成 ${bDef.name} ×${qty}`);

            recomputeCapacities();
            checkMissions();
            checkEraAdvancement();
            dirtyUI = true;
            updateUI();
            return true;
        }

        function adjustJob(jobId, delta) {
            const w = save.world;
            const cur = w.jobs[jobId] || 0;
            const assigned = Object.values(w.jobs).reduce((a, c) => a + c, 0);
            const idle = Math.max(0, Math.floor(w.pop) - assigned);

            if (delta > 0) {
                const add = Math.min(delta, idle);
                if (add <= 0) return;
                w.jobs[jobId] = cur + add;
            } else {
                const sub = Math.min(-delta, cur);
                if (sub <= 0) return;
                w.jobs[jobId] = cur - sub;
            }
            sound.playClick();
            checkMissions();
            dirtyUI = true;
            updateUI();
        }

        /* 第一轨转生：☢️ 相互保证毁灭（MAD 核弹重置，源自 main.js zn("mad")） */
        function canMadResetNow() {
            ensureEvolveWorldFields();
            const w = save.world;
            return w.eraIndex >= 4 && !!w.techs.nuclearFission && (w.extraBlds.missile_silo || 0) >= 1;
        }

        function calcMadPlasmidGain() {
            ensureEvolveWorldFields();
            const w = save.world;
            const citizens = Math.floor(w.pop || 0);
            const soldiers = (w.extraBlds.garrison || 0) * 3 + (w.extraBlds.missile_silo || 0) * 5;
            const techCnt = Object.keys(w.techs).filter(k => w.techs[k]).length;
            const base = Math.max(5, Math.round((citizens + soldiers) / 3 + techCnt * 0.4));
            const mult = (window.EvolveModules && window.EvolveModules.Bridge)
                ? window.EvolveModules.Bridge.computePrestigeBonusMultiplier(save, true) : 1.0;
            return Math.max(5, Math.round(base * mult));
        }

        function triggerMadReset() {
            if (!canMadResetNow()) {
                showToast('需达到原子时代、研究【核裂变】并建造至少 1 座【导弹发射井】！');
                return;
            }
            const gain = calcMadPlasmidGain();
            openModal({
                title: '☢️ 相互保证毁灭 (MAD 核弹重置)',
                bodyHtml: `
                    <p style="margin-bottom:8px; color:#fca5a5;">“按下红色按钮，核火洗礼大地，旧文明化为灰烬，但辐射促成了基因的极速飞跃！”</p>
                    <div class="pixel-card" style="padding:8px; color:#f8fafc; border-color:#f43f5e;">
                        🧬 获得质粒 / 创世余烬：<strong class="text-amber">+${gain} 枚</strong><br>
                        ⚡ 激活永久基因特质：<strong class="text-emerald">【快速突变】(RNA/DNA进化产出×2)</strong><br>

        /* 第二轨终局转生：🚀 恒星际殖民方舟（Bioseed / Stellar Ark） */
        function calcPrestigeGain() {
            const w = save.world;
            const techCnt = Object.keys(w.techs).filter(k => w.techs[k]).length;
            const bldCnt = Object.values(w.buildings).reduce((a, c) => a + c, 0);
            const base = Math.max(15, Math.floor(Math.sqrt(Math.floor(w.pop) / 10) + techCnt / 2 + bldCnt / 50) + 10);
            const mult = (window.EvolveModules && window.EvolveModules.Bridge)
                ? window.EvolveModules.Bridge.computePrestigeBonusMultiplier(save, false) : 1.0;
            return Math.max(15, Math.round(base * mult));
        }

        function calcPhageGain() {
            const w = save.world;
            return Math.max(2, Math.floor(Math.sqrt(Math.floor(w.pop) / 25)) + 2);
        }

        function canPrestigeNow() {
            const w = save.world;
            return w.eraIndex === 6 && !!w.techs.interstellarTravel && (w.buildings.colonyShip || 0) >= 1;
        }

        function triggerPrestige() {
            if (!canPrestigeNow()) {
                showToast('需达到太空文明、研究【星际航行】并建造【恒星际殖民方舟】！');
                return;
            }
            const gain = calcPrestigeGain();
            const phageGain = calcPhageGain();
            openModal({
                title: '🚀 启动恒星际文明跃迁 (Bioseed / 方舟播种)',
                bodyHtml: `
                    <p style="margin-bottom:8px;">恒星际殖民方舟已装载基因库准备启航！飞向新星系将重置当前行星进度并获得高等传承：</p>

                        🦠 获得噬菌体 (Phage)：+${phageGain} 枚 (全资源仓储上限 +${phageGain * 5}% & 产能 +${phageGain * 3}%)<br>
                        ✨ 激活/保留【快速突变】与【远古遗迹】特质
                    </div>
                `,
                buttons: [
                    { text: '取消', cls: 'bg-slate' },
                    {
                        text: `🚀 启航播种 (+${gain}余烬 +${phageGain}噬菌体)`,
                        cls: 'bg-purple',
                        onClick: () => {
                            save.prestige.count += 1;
                            save.prestige.arkCount = (save.prestige.arkCount || 0) + 1;
                            save.prestige.genesisShards += gain;
                            save.prestige.lifetimeShards += gain;
                            save.prestige.phage = (save.prestige.phage || 0) + phageGain;
                            save.prestige.rapidMutation = true;
                            save.prestige.ancientRuins = true;

                            save.world = createInitialWorld();
                            if (window.EvolveModules && window.EvolveModules.Bridge) {
                                window.EvolveModules.Bridge.applyNextWorldPreset(save);
                            }
                            save.lastActiveAt = Date.now();
                            recomputeCapacities();
                            saveGame(false);
                            sound.playEra();
                            showToast(`🚀 星际播种成功！获得 ${gain} 余烬与 ${phageGain} 噬菌体！`);
